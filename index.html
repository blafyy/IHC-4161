<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />

    <!--  Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <section class="login-container">
      <div class="login-box">

        <!-- LOGIN -->
        <div id="loginForm">

          <!-- Logo -->
          <div class="login-logo">
            <img src="image/logo_ihc.png" alt="Logo IHC" />
          </div>

          <form onsubmit="return validarLogin(event);">

            <div class="input-group">
              <label for="username">Usuario</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input
                  type="text"
                  id="username"
                  placeholder="Introduce tu usuario"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>
                <input
                  type="email"
                  id="email"
                  placeholder="Introduce tu email"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="password">Contraseña (ok)</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="password"
                  placeholder="Introduce la clave secreta"
                  required
                />
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
              </div>
            </div>

            <p class="forgot-password">¿Olvidaste tu contraseña?</p>

            <button type="submit" class="login-button">Iniciar Sesión</button>
          </form>

          <button class="create-account-button" onclick="mostrarRegistro()">
            Crear nueva cuenta
          </button>

          <div class="extra-links">
            <a href="#">About</a>
            <span>·</span>
            <a href="#">Help</a>
            <span>·</span>
            <a href="#">More</a>
          </div>

          <p class="footer-text">MyLook © 2025</p>
        </div>

        <!--  REGISTRO (MISMO DISEÑO) -->
        <div id="registerForm" style="display: none;">
          <div class="login-logo">
            <img src="image/logo_ihc.png" alt="Logo IHC" />
          </div>

          <form onsubmit="return registrarUsuario(event);">

            <div class="input-group">
              <label for="nombre">Nombre</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-id-card"></i>
                <input
                  type="text"
                  id="nombre"
                  placeholder="Introduce tu nombre"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="apellido">Apellido</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-id-card"></i>
                <input
                  type="text"
                  id="apellido"
                  placeholder="Introduce tu apellido"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="regEmail">Email</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>
                <input
                  type="email"
                  id="regEmail"
                  placeholder="Introduce tu email"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="regPass">Contraseña</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="regPass"
                  placeholder="Crea una contraseña"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="regConfirm">Confirmar contraseña</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="regConfirm"
                  placeholder="Repite la contraseña"
                  required
                />
              </div>
            </div>

            <button type="submit" class="login-button">Registrar</button>
          </form>

          <button class="create-account-button" onclick="mostrarLogin()">
            Volver al inicio
          </button>

          <p class="footer-text">MyLook © 2025</p>
        </div>

      </div>
    </section>

    <script src="login.js"></script>
  </body>
</html>
